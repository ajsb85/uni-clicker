name: Firmware simulation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libicu74 ninja-build protobuf-compiler
          rustup target add thumbv7em-none-eabihf

      - name: Prepare pinned SDKs and simulator
        env:
          FREERTOS_REV: 9b777ae5c5b8e9e456065a00294d1e5f5f9facf5
          TONBAND_REV: 73aa9e440e2c0d920f990932e282e329069f40b0
          RENODE_SHA256: 4ba7c68b59e2447f188ef4b4b112fcccd2802582c460beedceb63b84e5605a5f
        run: |
          source tools/bench-env.sh
          make deps-stm32cube
          cache="$PWD/.cache/ci"
          mkdir -p "$cache/renode"
          checkout() {
              git init -q "$2"
              git -C "$2" fetch --depth 1 "$1" "$3"
              git -C "$2" checkout --detach FETCH_HEAD
          }
          checkout https://github.com/FreeRTOS/FreeRTOS-Kernel.git "$cache/freertos" "$FREERTOS_REV"
          checkout https://github.com/schilkp/Tonbandgeraet.git "$cache/tonbandgeraet" "$TONBAND_REV"

          archive="$cache/renode.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/renode/renode/releases/download/v1.17.0/renode-1.17.0.linux-portable.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$RENODE_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$cache/renode"
          renode=$(find "$cache/renode" -type f -name renode -print -quit)
          test -x "$renode"
          "$renode" --version

          cargo fetch --locked --manifest-path examples/rust/Cargo.toml --target thumbv7em-none-eabihf
          CARGO_PROFILE_DEV_DEBUG=0 CARGO_INCREMENTAL=0 cargo build --locked \
            --manifest-path "$cache/tonbandgeraet/tools/Cargo.toml" --target-dir "$cache/target" \
            -p tband-cli --no-default-features
          {
            printf 'RENODE=%s\n' "$renode"
            printf 'FREERTOS_ROOT=%s/freertos\n' "$cache"
            printf 'TONBAND_ROOT=%s/tonbandgeraet\n' "$cache"
            printf 'TBAND_CLI=%s/target/debug/tband-cli\n' "$cache"
          } >> "$GITHUB_ENV"

      - name: Run unit tests and firmware simulations
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          source tools/bench-env.sh
          cargo test --locked --manifest-path tools/uni-cli/Cargo.toml --target-dir build/cli
          make cli
          cli=build/cli/debug/uni-cli
          result=0
          "$cli" check rust || result=1
          for profile in stm32cube freertos freertos-console; do
              "$cli" check "$profile" --trace || result=1
          done
          exit "$result"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-verification
          include-hidden-files: true
          path: |
            .cache/verification/
            .cache/sim/
