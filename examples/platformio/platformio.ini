[platformio]
default_envs = arduino, stm32cube, cmsis, libopencm3, zephyr

[env]
platform = ststm32@20.0.0
board = nucleo_f746zg
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_type = debug
extra_scripts = post:renode_runner.py

[env:arduino]
framework = arduino
board_build.f_cpu = 16000000L
build_src_filter = +<arduino.cpp>

[env:stm32cube]
framework = stm32cube
board_build.stm32cube.custom_config_header = yes
build_flags = -I../stm32cube
build_src_filter = +<stm32cube.c>

[env:cmsis]
framework = cmsis
build_src_filter = +<cmsis.c>

[env:libopencm3]
framework = libopencm3
build_src_filter = +<libopencm3.c>

[env:zephyr]
framework = zephyr
build_src_filter = +<zephyr.c>
